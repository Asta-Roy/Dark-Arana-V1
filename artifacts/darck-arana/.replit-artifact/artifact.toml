kind = "web"
previewPath = "/"
title = "Darck Arana AI"
version = "1.0.0"
id = "artifacts/darck-arana"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24452

[services.development]
run = "pnpm --filter @workspace/darck-arana run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/darck-arana", "run", "build" ]
publicDir = "artifacts/darck-arana/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24452"
BASE_PATH = "/"
