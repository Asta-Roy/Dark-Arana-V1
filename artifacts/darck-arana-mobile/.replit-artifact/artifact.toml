kind = "mobile"
previewPath = "/mobile/"
title = "Darck Arana Mobile"
version = "1.0.0"
id = "artifacts/darck-arana-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19949

[services.development]
run = "pnpm --filter @workspace/darck-arana-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/darck-arana-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/darck-arana-mobile", "run", "serve" ]

[services.env]
PORT = "19949"
BASE_PATH = "/mobile/"
