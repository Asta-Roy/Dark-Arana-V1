name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Build APK from scratch
        run: |
          npx create-expo-app@latest my-app --template blank --yes
          cd my-app
          npm install
          npx expo prebuild --platform android --no-install
          cd android
                    chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Arana-APK
          path: my-app/android/app/build/outputs/apk/release/app-release.apk
